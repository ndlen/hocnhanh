<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd93d">
  <meta name="description" content="Học thuộc danh mục tài liệu hồ sơ đảng viên">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Học thuộc HS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Học thuộc hồ sơ đảng viên</title>
  <style>
    :root {
      --ink: #111;
      --paper: #fff8e7;
      --yellow: #ffd93d;
      --pink: #ff6b9d;
      --blue: #4cc9f0;
      --green: #6bff95;
      --orange: #ff9f43;
      --purple: #b388ff;
      --red: #ff5252;
      --bd: 3px solid var(--ink);
      --sh: 5px 5px 0 var(--ink);
      --sh-s: 3px 3px 0 var(--ink);
      --fs: clamp(15px, 1.1vw + 12px, 18px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      font-size: var(--fs);
      color: var(--ink);
      background: var(--paper);
      background-image: radial-gradient(var(--ink) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      line-height: 1.4;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: var(--bd);
      background: #fff;
      box-shadow: var(--sh-s);
      transition: transform .08s, box-shadow .08s;
      touch-action: manipulation
    }

    button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink)
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink)
    }

    input {
      font: inherit;
      border: var(--bd);
      padding: .6em .8em;
      background: #fff;
      box-shadow: var(--sh-s);
      outline: none;
      min-width: 0
    }

    input:focus {
      background: var(--yellow)
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(10px, 2.5vw, 24px)
    }

    /* header */
    header {
      background: var(--yellow);
      border: var(--bd);
      box-shadow: var(--sh);
      padding: clamp(12px, 2.5vw, 22px);
      position: relative;
      margin-bottom: clamp(14px, 2.5vw, 22px);
      overflow: hidden
    }

    header::before {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 110px;
      height: 110px;
      background: var(--pink);
      border: var(--bd);
      border-radius: 50%
    }

    header::after {
      content: "";
      position: absolute;
      right: 60px;
      bottom: -26px;
      width: 70px;
      height: 70px;
      background: var(--blue);
      border: var(--bd);
      transform: rotate(18deg)
    }

    h1 {
      font-size: clamp(1.3rem, 4.5vw, 2.4rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -.5px;
      line-height: 1.05;
      position: relative;
      z-index: 1;
      max-width: 80%
    }

    header p {
      font-weight: 700;
      margin-top: .4em;
      position: relative;
      z-index: 1;
      max-width: 80%;
      font-size: .9em
    }

    .tag {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      padding: .1em .5em;
      transform: rotate(-2deg);
      margin-right: .3em
    }

    /* tabs */
    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 1.5vw, 14px);
      margin-bottom: clamp(14px, 2.5vw, 22px)
    }

    nav button {
      padding: .7em .4em;
      font-weight: 900;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .15em;
      font-size: .95em;
      line-height: 1.1
    }

    nav button small {
      font-weight: 700;
      text-transform: none;
      font-size: .72em;
      opacity: .85
    }

    nav button .ic {
      font-size: 1.5em
    }

    nav button[data-m="read"] {
      background: var(--blue)
    }

    nav button[data-m="quiz"] {
      background: var(--green)
    }

    nav button[data-m="prio"] {
      background: var(--pink)
    }

    nav button.on {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 var(--ink);
      outline: 4px solid var(--ink);
      outline-offset: 2px
    }

    @media(max-width:480px) {
      nav button small {
        display: none
      }
    }

    .panel {
      display: none
    }

    .panel.on {
      display: block
    }

    /* toolbar */
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center
    }

    .bar input {
      flex: 1 1 200px
    }

    .chip {
      padding: .45em .8em;
      font-weight: 800;
      font-size: .85em
    }

    .chip.on {
      background: var(--ink);
      color: #fff
    }

    .chip.c1.on {
      background: var(--ink)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      font-weight: 700;
      font-size: .85em;
      margin-bottom: 14px;
      background: #fff;
      border: var(--bd);
      padding: .6em .8em;
      box-shadow: var(--sh-s)
    }

    .dot {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid var(--ink);
      vertical-align: -.15em;
      margin-right: .3em
    }

    /* read list */
    .sec {
      margin-bottom: 22px
    }

    .sec-h {
      border: var(--bd);
      box-shadow: var(--sh-s);
      padding: .6em .9em;
      font-weight: 900;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 6px;
      z-index: 5
    }

    .sec-h small {
      font-weight: 700;
      text-transform: none
    }

    .sec.p1 .sec-h {
      background: var(--orange)
    }

    .sec.p2 .sec-h {
      background: var(--purple)
    }

    .sec.p3 .sec-h {
      background: var(--blue)
    }

    .list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      grid-template-columns: 1fr
    }

    @media(min-width:760px) {
      .list {
        grid-template-columns: 1fr 1fr
      }
    }

    .item {
      display: flex;
      gap: 10px;
      align-items: stretch;
      background: #fff;
      border: var(--bd);
      box-shadow: var(--sh-s);
      padding: 0;
      cursor: pointer;
      text-align: left;
      width: 100%;
      position: relative
    }

    .item .no {
      flex: 0 0 auto;
      min-width: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.25em;
      border-right: var(--bd);
      padding: .4em .3em;
      background: var(--blue)
    }

    .sec.p2 .item .no {
      background: var(--purple)
    }

    .sec.p3 .item .no {
      background: var(--blue)
    }

    .sec.p1 .item .no {
      background: var(--orange)
    }

    .item .tx {
      padding: .55em .7em .55em 0;
      font-weight: 600;
      align-self: center;
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere
    }

    /* nút xem mô tả: ô vuông neo-brutalism, nằm gọn trong thẻ */
    .ico-i {
      width: 1em;
      height: 1em;
      display: block;
      fill: currentColor
    }

    .item .info-btn {
      flex: 0 0 auto;
      align-self: center;
      width: 38px;
      height: 38px;
      margin: 6px 8px 6px 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--ink);
      background: var(--yellow);
      border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .08s, box-shadow .08s, background .08s
    }

    .item .info-btn:hover {
      background: var(--pink);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink)
    }

    .item .info-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--ink)
    }

    .item .info-btn:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px
    }

    .i-badge {
      display: inline-flex;
      vertical-align: -5px;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      margin: 0 2px
    }

    .item.star {
      background: var(--yellow)
    }

    .item.star .no {
      background: var(--ink) !important;
      color: var(--yellow)
    }

    .item.star .tx::before {
      content: "★ ";
      font-weight: 900
    }

    .item.star {
      box-shadow: 5px 5px 0 var(--pink)
    }

    .item.star .info-btn {
      background: #fff
    }

    .item.star .info-btn:hover {
      background: var(--pink)
    }

    .hide .item .tx {
      color: transparent;
      background: repeating-linear-gradient(45deg, #ddd 0 8px, #eee 8px 16px);
      user-select: none
    }

    .hide .item .tx::before {
      color: transparent
    }

    .hide .item:not(.reveal) .info-btn {
      display: none
    }

    .hide .item.reveal .tx {
      color: var(--ink);
      background: none
    }

    .hide .item.reveal .tx::before {
      color: var(--ink)
    }

    .empty {
      padding: 20px;
      text-align: center;
      font-weight: 800;
      background: #fff;
      border: var(--bd)
    }

    mark {
      background: var(--green);
      padding: 0 .1em
    }

    /* quiz */
    .quiz {
      display: grid;
      gap: clamp(12px, 2vw, 20px);
      grid-template-columns: 1fr
    }

    @media(min-width:860px) {
      .quiz {
        grid-template-columns: 1.15fr .85fr;
        align-items: start
      }
    }

    .card {
      background: #fff;
      border: var(--bd);
      box-shadow: var(--sh);
      padding: clamp(12px, 2.5vw, 22px);
      position: relative
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px
    }

    .stat {
      border: var(--bd);
      padding: .4em .2em;
      text-align: center;
      font-weight: 900;
      box-shadow: var(--sh-s);
      line-height: 1.1
    }

    .stat b {
      display: block;
      font-size: 1.4em
    }

    .stat span {
      font-size: .65em;
      text-transform: uppercase;
      font-weight: 800
    }

    .stat:nth-child(1) {
      background: var(--blue)
    }

    .stat:nth-child(2) {
      background: var(--green)
    }

    .stat:nth-child(3) {
      background: var(--red)
    }

    .stat:nth-child(4) {
      background: var(--yellow)
    }

    .prog {
      height: 18px;
      border: var(--bd);
      background: #fff;
      margin-bottom: 14px;
      overflow: hidden
    }

    .prog i {
      display: block;
      height: 100%;
      background: repeating-linear-gradient(45deg, var(--pink) 0 10px, var(--orange) 10px 20px);
      width: 0;
      transition: width .3s
    }

    .qlab {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      padding: .15em .6em;
      font-size: .8em;
      margin-bottom: .6em;
      transform: rotate(-1.5deg)
    }

    .qtxt {
      font-size: clamp(1.15rem, 3.2vw, 1.75rem);
      font-weight: 900;
      line-height: 1.25;
      overflow-wrap: anywhere;
      min-height: 3.8em;
      display: flex;
      align-items: center
    }

    .qapp {
      position: absolute;
      top: -14px;
      right: 10px;
      border: var(--bd);
      padding: .1em .6em;
      font-weight: 900;
      font-size: .8em;
      background: var(--blue);
      transform: rotate(3deg)
    }

    .qstar {
      background: var(--yellow)
    }

    .fb {
      margin-top: 12px;
      border: var(--bd);
      padding: .7em .9em;
      font-weight: 800;
      display: none;
      box-shadow: var(--sh-s)
    }

    .fb.ok {
      display: block;
      background: var(--green)
    }

    .fb.no {
      display: block;
      background: var(--red);
      color: #fff
    }

    .fb.sk {
      display: block;
      background: var(--yellow)
    }

    .fb .big {
      font-size: 1.6em;
      font-weight: 900
    }

    .pad {
      background: var(--purple)
    }

    .screen {
      border: var(--bd);
      background: #111;
      color: var(--green);
      font-family: "Courier New", monospace;
      font-weight: 900;
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      text-align: right;
      padding: .1em .35em;
      margin-bottom: 12px;
      min-height: 1.4em;
      box-shadow: inset 4px 4px 0 #333;
      overflow: hidden;
      white-space: nowrap
    }

    .screen.shake {
      animation: sh .35s
    }

    @keyframes sh {

      20%,
      60% {
        transform: translateX(-8px)
      }

      40%,
      80% {
        transform: translateX(8px)
      }
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(6px, 1.6vw, 10px)
    }

    .keys button {
      font-weight: 900;
      font-size: clamp(1.4rem, 5vw, 2rem);
      padding: clamp(.45em, 2.2vh, .7em) 0;
      background: #fff
    }

    .keys button:nth-child(3n+1) {
      background: var(--yellow)
    }

    .keys button:nth-child(3n+2) {
      background: var(--blue)
    }

    .keys button:nth-child(3n) {
      background: var(--pink)
    }

    .keys .del {
      background: var(--red) !important;
      color: #fff;
      font-size: clamp(1rem, 3.5vw, 1.3rem)
    }

    .keys .ok {
      background: var(--green) !important;
      font-size: clamp(1rem, 3.5vw, 1.3rem)
    }

    .keys .zero {
      background: var(--orange) !important
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px
    }

    .row2 button {
      padding: .6em;
      font-weight: 800;
      font-size: .9em
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px
    }

    .note {
      font-size: .82em;
      font-weight: 700;
      margin-top: 10px;
      opacity: .85
    }

    .done {
      text-align: center
    }

    .done h2 {
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: .4em
    }

    .done button {
      padding: .7em 1.2em;
      font-weight: 900;
      margin: 6px;
      background: var(--green)
    }

    /* mobile: keep keypad reachable */
    @media(max-width:859px) {
      .qtxt {
        min-height: 0
      }

      .stats {
        gap: 6px
      }
    }

    @media(max-height:620px) and (orientation:landscape) {
      .quiz {
        grid-template-columns: 1fr 1fr
      }

      .keys button {
        padding: .3em 0;
        font-size: 1.2rem
      }

      .screen {
        font-size: 1.8rem
      }
    }

    .foot {
      text-align: center;
      font-weight: 800;
      font-size: .8em;
      margin: 24px 0 8px
    }

    .top {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      background: var(--pink);
      font-weight: 900;
      padding: .5em .8em;
      z-index: 20;
      display: none
    }

    .top.show {
      display: block
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(17, 17, 17, .55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, visibility .2s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible
    }

    .modal-box {
      background: var(--paper);
      border: var(--bd);
      box-shadow: var(--sh);
      max-width: 560px;
      width: 100%;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(18px) scale(.97);
      transition: transform .22s cubic-bezier(.22, 1, .36, 1);
      overflow: hidden;
    }

    .modal-overlay.open .modal-box {
      transform: translateY(0) scale(1)
    }

    .modal-head {
      padding: 14px 16px 12px;
      border-bottom: var(--bd);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      flex-shrink: 0;
      background: var(--yellow);
    }

    .modal-num {
      flex: 0 0 auto;
      font-size: 1.6rem;
      font-weight: 900;
      width: 2.4rem;
      height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: var(--bd);
      background: var(--ink);
      color: var(--yellow);
      line-height: 1;
    }

    .modal-title {
      flex: 1;
      font-weight: 900;
      font-size: 1.05rem;
      line-height: 1.3
    }

    .modal-pl {
      display: inline-block;
      font-size: .75rem;
      font-weight: 800;
      padding: .1em .5em;
      margin-top: .35em;
      border: var(--bd);
      transform: rotate(-1.5deg)
    }

    .modal-body {
      padding: 18px 18px 20px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .modal-body p {
      line-height: 1.7;
      font-size: .97rem;
      font-weight: 500;
      color: var(--ink);
    }

    .modal-body p+p {
      margin-top: 1em
    }

    .modal-body .modal-label {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      font-size: .72rem;
      font-weight: 900;
      padding: .15em .55em;
      margin-bottom: .6em;
      letter-spacing: .03em;
    }

    .modal-close {
      flex: 0 0 auto;
      background: var(--red);
      color: #fff;
      border: var(--bd);
      padding: .3em .65em;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: none;
      align-self: flex-start;
    }

    .modal-close:hover {
      background: var(--ink);
      transform: none;
      box-shadow: none
    }

    .modal-close:active {
      transform: none;
      box-shadow: none
    }

    .modal-star-badge {
      display: inline-flex;
      align-items: center;
      gap: .3em;
      background: var(--pink);
      border: var(--bd);
      padding: .15em .5em;
      font-size: .75rem;
      font-weight: 900;
      margin-left: .4em;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1><span class="tag">HỌC THUỘC</span>Danh mục tài liệu hồ sơ đảng viên</h1>
    </header>
    <button id="installBtn"
      style="display:none;width:100%;margin:-6px 0 18px;padding:.8em;font-weight:900;background:var(--green);text-transform:uppercase">📲
      Cài app về điện thoại</button>

    <nav id="tabs">
      <button data-m="read"><span class="ic">📖</span>Xem &amp; đọc<small>Đọc toàn bộ</small></button>
      <button data-m="quiz"><span class="ic">🧮</span>Ôn tập<small>Nhập số TT</small></button>
      <button data-m="prio"><span class="ic">⭐</span>Ôn ưu tiên<small>Mục hay dùng</small></button>
    </nav>

    <!-- MODE 1 -->
    <section class="panel" id="p-read">
      <div class="legend">
        <span><span class="dot" style="background:var(--yellow)"></span>★ Mục ưu tiên</span>
        <span><span class="dot" style="background:var(--orange)"></span>PL 01</span>
