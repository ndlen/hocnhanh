<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd93d">
<meta name="description" content="Học thuộc danh mục tài liệu hồ sơ đảng viên">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học thuộc HS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Học thuộc hồ sơ đảng viên</title>
<style>
:root{
  --ink:#111;--paper:#fff8e7;--yellow:#ffd93d;--pink:#ff6b9d;--blue:#4cc9f0;--green:#6bff95;--orange:#ff9f43;--purple:#b388ff;--red:#ff5252;
  --bd:3px solid var(--ink);--sh:5px 5px 0 var(--ink);--sh-s:3px 3px 0 var(--ink);
  --fs:clamp(15px,1.1vw + 12px,18px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"Space Grotesk","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:var(--fs);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(var(--ink) 1.2px,transparent 1.2px);background-size:22px 22px;
  min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  line-height:1.4;
}
button{font:inherit;color:inherit;cursor:pointer;border:var(--bd);background:#fff;box-shadow:var(--sh-s);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
input{font:inherit;border:var(--bd);padding:.6em .8em;background:#fff;box-shadow:var(--sh-s);outline:none;min-width:0}
input:focus{background:var(--yellow)}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(10px,2.5vw,24px)}

/* header */
header{background:var(--yellow);border:var(--bd);box-shadow:var(--sh);padding:clamp(12px,2.5vw,22px);position:relative;margin-bottom:clamp(14px,2.5vw,22px);overflow:hidden}
header::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;background:var(--pink);border:var(--bd);border-radius:50%}
header::after{content:"";position:absolute;right:60px;bottom:-26px;width:70px;height:70px;background:var(--blue);border:var(--bd);transform:rotate(18deg)}
h1{font-size:clamp(1.3rem,4.5vw,2.4rem);font-weight:900;text-transform:uppercase;letter-spacing:-.5px;line-height:1.05;position:relative;z-index:1;max-width:80%}
header p{font-weight:700;margin-top:.4em;position:relative;z-index:1;max-width:80%;font-size:.9em}
.tag{display:inline-block;background:var(--ink);color:#fff;padding:.1em .5em;transform:rotate(-2deg);margin-right:.3em}

/* tabs */
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.5vw,14px);margin-bottom:clamp(14px,2.5vw,22px)}
nav button{padding:.7em .4em;font-weight:900;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:.15em;font-size:.95em;line-height:1.1}
nav button small{font-weight:700;text-transform:none;font-size:.72em;opacity:.85}
nav button .ic{font-size:1.5em}
nav button[data-m="read"]{background:var(--blue)}
nav button[data-m="quiz"]{background:var(--green)}
nav button[data-m="prio"]{background:var(--pink)}
nav button.on{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);outline:4px solid var(--ink);outline-offset:2px}
@media(max-width:480px){nav button small{display:none}}

.panel{display:none}.panel.on{display:block}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.bar input{flex:1 1 200px}
.chip{padding:.45em .8em;font-weight:800;font-size:.85em}
.chip.on{background:var(--ink);color:#fff}
.chip.c1.on{background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-weight:700;font-size:.85em;margin-bottom:14px;background:#fff;border:var(--bd);padding:.6em .8em;box-shadow:var(--sh-s)}
.dot{display:inline-block;width:1em;height:1em;border:2px solid var(--ink);vertical-align:-.15em;margin-right:.3em}

/* read list */
.sec{margin-bottom:22px}
.sec-h{border:var(--bd);box-shadow:var(--sh-s);padding:.6em .9em;font-weight:900;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:6px;z-index:5}
.sec-h small{font-weight:700;text-transform:none}
.sec.p1 .sec-h{background:var(--orange)}.sec.p2 .sec-h{background:var(--purple)}.sec.p3 .sec-h{background:var(--blue)}
.list{display:grid;gap:10px;margin-top:12px;grid-template-columns:1fr}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:10px;align-items:stretch;background:#fff;border:var(--bd);box-shadow:var(--sh-s);padding:0;cursor:pointer;text-align:left;width:100%}
.item .no{flex:0 0 auto;min-width:2.6em;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.25em;border-right:var(--bd);padding:.4em .3em;background:var(--blue)}
.sec.p2 .item .no{background:var(--purple)}.sec.p3 .item .no{background:var(--blue)}.sec.p1 .item .no{background:var(--orange)}
.item .tx{padding:.55em .7em .55em 0;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.item.star{background:var(--yellow)}
.item.star .no{background:var(--ink)!important;color:var(--yellow)}
.item.star .tx::before{content:"★ ";font-weight:900}
.item.star{box-shadow:5px 5px 0 var(--pink)}
.hide .item .tx{color:transparent;background:repeating-linear-gradient(45deg,#ddd 0 8px,#eee 8px 16px);user-select:none}
.hide .item .tx::before{color:transparent}
.hide .item.reveal .tx{color:var(--ink);background:none}
.hide .item.reveal .tx::before{color:var(--ink)}
.empty{padding:20px;text-align:center;font-weight:800;background:#fff;border:var(--bd)}
mark{background:var(--green);padding:0 .1em}

/* quiz */
.quiz{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr}
@media(min-width:860px){.quiz{grid-template-columns:1.15fr .85fr;align-items:start}}
.card{background:#fff;border:var(--bd);box-shadow:var(--sh);padding:clamp(12px,2.5vw,22px);position:relative}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{border:var(--bd);padding:.4em .2em;text-align:center;font-weight:900;box-shadow:var(--sh-s);line-height:1.1}
.stat b{display:block;font-size:1.4em}.stat span{font-size:.65em;text-transform:uppercase;font-weight:800}
.stat:nth-child(1){background:var(--blue)}.stat:nth-child(2){background:var(--green)}.stat:nth-child(3){background:var(--red)}.stat:nth-child(4){background:var(--yellow)}
.prog{height:18px;border:var(--bd);background:#fff;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,var(--orange) 10px 20px);width:0;transition:width .3s}
.qlab{display:inline-block;background:var(--ink);color:#fff;font-weight:800;padding:.15em .6em;font-size:.8em;margin-bottom:.6em;transform:rotate(-1.5deg)}
.qtxt{font-size:clamp(1.15rem,3.2vw,1.75rem);font-weight:900;line-height:1.25;overflow-wrap:anywhere;min-height:3.8em;display:flex;align-items:center}
.qapp{position:absolute;top:-14px;right:10px;border:var(--bd);padding:.1em .6em;font-weight:900;font-size:.8em;background:var(--blue);transform:rotate(3deg)}
.qstar{background:var(--yellow)}
.fb{margin-top:12px;border:var(--bd);padding:.7em .9em;font-weight:800;display:none;box-shadow:var(--sh-s)}
.fb.ok{display:block;background:var(--green)}.fb.no{display:block;background:var(--red);color:#fff}.fb.sk{display:block;background:var(--yellow)}
.fb .big{font-size:1.6em;font-weight:900}
.pad{background:var(--purple)}
.screen{border:var(--bd);background:#111;color:var(--green);font-family:"Courier New",monospace;font-weight:900;font-size:clamp(2.2rem,8vw,3.4rem);text-align:right;padding:.1em .35em;margin-bottom:12px;min-height:1.4em;box-shadow:inset 4px 4px 0 #333;overflow:hidden;white-space:nowrap}
.screen.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.6vw,10px)}
.keys button{font-weight:900;font-size:clamp(1.4rem,5vw,2rem);padding:clamp(.45em,2.2vh,.7em) 0;background:#fff}
.keys button:nth-child(3n+1){background:var(--yellow)}
.keys button:nth-child(3n+2){background:var(--blue)}
.keys button:nth-child(3n){background:var(--pink)}
.keys .del{background:var(--red)!important;color:#fff;font-size:clamp(1rem,3.5vw,1.3rem)}
.keys .ok{background:var(--green)!important;font-size:clamp(1rem,3.5vw,1.3rem)}
.keys .zero{background:var(--orange)!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row2 button{padding:.6em;font-weight:800;font-size:.9em}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.note{font-size:.82em;font-weight:700;margin-top:10px;opacity:.85}
.done{text-align:center}
.done h2{font-size:1.8rem;font-weight:900;text-transform:uppercase;margin-bottom:.4em}
.done button{padding:.7em 1.2em;font-weight:900;margin:6px;background:var(--green)}

/* mobile: keep keypad reachable */
@media(max-width:859px){
  .qtxt{min-height:0}
  .stats{gap:6px}
}
@media(max-height:620px) and (orientation:landscape){
  .quiz{grid-template-columns:1fr 1fr}
  .keys button{padding:.3em 0;font-size:1.2rem}
  .screen{font-size:1.8rem}
}
.foot{text-align:center;font-weight:800;font-size:.8em;margin:24px 0 8px}
.top{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--pink);font-weight:900;padding:.5em .8em;z-index:20;display:none}
.top.show{display:block}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="tag">HỌC THUỘC</span>Danh mục tài liệu hồ sơ đảng viên</h1>
</header>
<button id="installBtn" style="display:none;width:100%;margin:-6px 0 18px;padding:.8em;font-weight:900;background:var(--green);text-transform:uppercase">📲 Cài app về điện thoại</button>

<nav id="tabs">
  <button data-m="read"><span class="ic">📖</span>Xem &amp; đọc<small>Đọc toàn bộ</small></button>
  <button data-m="quiz"><span class="ic">🧮</span>Ôn tập<small>Nhập số TT</small></button>
  <button data-m="prio"><span class="ic">⭐</span>Ôn ưu tiên<small>Mục hay dùng</small></button>
</nav>

<!-- MODE 1 -->
<section class="panel" id="p-read">
  <div class="legend">
    <span><span class="dot" style="background:var(--yellow)"></span>★ Mục ưu tiên</span>
    <span><span class="dot" style="background:var(--orange)"></span>PL 01</span>
    <span><span class="dot" style="background:var(--purple)"></span>PL 02</span>
    <span><span class="dot" style="background:var(--blue)"></span>PL 03</span>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="🔍 Tìm theo số hoặc tên…" autocomplete="off">
  </div>
  <div class="bar" id="filters">
    <button class="chip on" data-f="all">Tất cả</button>
    <button class="chip" data-f="star">★ Ưu tiên</button>
    <button class="chip" data-f="1">PL 01</button>
    <button class="chip" data-f="2">PL 02</button>
    <button class="chip" data-f="3">PL 03</button>
    <button class="chip" id="hideBtn">🙈 Che tên (tự kiểm tra)</button>
  </div>
  <div id="readList"></div>
</section>

<!-- MODE 2 & 3 -->
<section class="panel" id="p-quiz">
  <div id="quizRoot"></div>
</section>
</div>
<button class="top" id="top">↑ Lên đầu</button>

<script>

const PRIO = [1,2,3,4,5,7,16,17,19,20,22,23,37,38,39,40,41,42,43,45,46,47,48,49,50,52,54,61,62,86,87,88,91];

const PLNAME = {1:'PL 01 · Số hóa trước',2:'PL 02 · Số hóa sau',3:'PL 03 · Số hóa sau cùng'};

const BY = {}; DATA.forEach(d=>BY[d.n]=d);
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- Tabs ---------- */
let mode = store.get('mode','read');
function setMode(m){
  mode=m; store.set('mode',m);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#p-read').classList.toggle('on',m==='read');
  $('#p-quiz').classList.toggle('on',m!=='read');
  if(m!=='read') startQuiz(m);
  window.scrollTo({top:0});
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

/* ---------- Mode 1 ---------- */
let filt='all', hideMode=false, query='';
const norm = s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function hl(text){
  if(!query || /^\d+$/.test(query)) return esc(text);
  const t=esc(text), nt=norm(text), nq=norm(query);
  const i=nt.indexOf(nq);
  if(i<0||nt.length!==text.length) return t;
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+query.length))+'</mark>'+esc(text.slice(i+query.length));
}
function renderRead(){
  const nq=norm(query.trim());
  let html='';
  [1,2,3].forEach(p=>{
    if(filt==='1'||filt==='2'||filt==='3'){ if(String(p)!==filt) return; }
    let items=DATA.filter(d=>d.p===p);
    if(filt==='star') items=items.filter(d=>PSET.has(d.n));
    if(nq) items=items.filter(d=>String(d.n)===nq||norm(d.t).includes(nq)||(/^\d+$/.test(nq)&&String(d.n).startsWith(nq)));
    if(!items.length) return;
    const stars=items.filter(d=>PSET.has(d.n)).length;
    html+=`<div class="sec p${p}"><div class="sec-h"><span>${PLNAME[p]}</span><small>${PLDESC[p]} · ${items.length} mục${stars?' · ★'+stars:''}</small></div><div class="list">`+
      items.map(d=>`<button class="item${PSET.has(d.n)?' star':''}" data-n="${d.n}"><span class="no">${d.n}</span><span class="tx">${hl(d.t)}</span></button>`).join('')+
      `</div></div>`;
  });
  $('#readList').innerHTML = html || '<div class="empty">Không tìm thấy 😢</div>';
  $('#readList').classList.toggle('hide',hideMode);
}
$('#q').oninput=e=>{query=e.target.value;renderRead()};
$('#filters').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='hideBtn'){hideMode=!hideMode;b.classList.toggle('on',hideMode);renderRead();return}
  filt=b.dataset.f;
  document.querySelectorAll('#filters [data-f]').forEach(x=>x.classList.toggle('on',x===b));
  renderRead();
};
$('#readList').onclick=e=>{
  const it=e.target.closest('.item'); if(it&&hideMode) it.classList.toggle('reveal');
};

/* ---------- Mode 2/3 ---------- */
let Q=null;
function startQuiz(m,opts){
  const isPrio = m==='prio';
  const saved = store.get('opt_'+m,{pl:'all'});
  const pl = (opts&&opts.pl) || saved.pl;
  store.set('opt_'+m,{pl});
  const wrongMap = store.get('wrong',{});
  let pool = DATA.filter(d=>(isPrio?PSET.has(d.n):true)&&(pl==='all'||String(d.p)===pl)).map(d=>d.n);
  Q = {m,isPrio,pl,pool,deck:shuffle(pool.slice()),total:pool.length,done:0,ok:0,bad:0,streak:0,best:0,
       cur:null,input:'',state:'ask',wrong:wrongMap,retry:[]};
  nextQ(); renderQuiz();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextQ(){
  Q.input=''; Q.state='ask';
  if(!Q.deck.length){Q.cur=null;return}
  // câu từng sai được ưu tiên xuất hiện sớm hơn
  let idx=0;
  const pickIdx=Q.deck.findIndex(n=>(Q.wrong[n]||0)>0 && Math.random()<.5);
  if(pickIdx>=0) idx=pickIdx;
  Q.cur=Q.deck.splice(idx,1)[0];
}
function renderQuiz(){
  const root=$('#quizRoot');
  const isPrio=Q.isPrio;
  const opts=`<div class="opts">
    <button class="chip ${Q.pl==='all'?'on':''}" data-pl="all">Tất cả</button>
    <button class="chip ${Q.pl==='1'?'on':''}" data-pl="1">PL 01</button>
    <button class="chip ${Q.pl==='2'?'on':''}" data-pl="2">PL 02</button>
    <button class="chip ${Q.pl==='3'?'on':''}" data-pl="3">PL 03</button>
    <button class="chip" data-act="restart">🔄 Làm lại</button>
  </div>`;
  const pct=Q.total?Math.round(Q.done/Q.total*100):0;
  const stats=`<div class="stats">
    <div class="stat"><b>${Q.done}/${Q.total}</b><span>Đã làm</span></div>
    <div class="stat"><b>${Q.ok}</b><span>Đúng</span></div>
    <div class="stat"><b>${Q.bad}</b><span>Sai</span></div>
    <div class="stat"><b>🔥${Q.streak}</b><span>Chuỗi</span></div></div>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
  if(!Q.total){root.innerHTML=opts+'<div class="empty">Không có mục nào trong phụ lục này.</div>';return}
  if(Q.cur===null){
    root.innerHTML=opts+stats+`<div class="card done"><h2>🎉 Hoàn thành!</h2>
      <p style="font-weight:800">Đúng ${Q.ok} · Sai ${Q.bad} · Chuỗi đúng dài nhất 🔥${Q.best}</p>
      <p class="note">Các câu sai sẽ được ưu tiên xuất hiện sớm ở lượt sau.</p>
      <button data-act="restart">🔄 Ôn lại từ đầu</button>
      ${Object.keys(Q.wrong).some(n=>Q.wrong[n]>0&&Q.pool.includes(+n))?'<button data-act="wrongOnly" style="background:var(--red);color:#fff">❌ Chỉ ôn câu hay sai</button>':''}</div>`;
    return;
  }
  const d=BY[Q.cur], star=PSET.has(d.n);
  let fb='';
  if(Q.state==='ok') fb=`<div class="fb ok"><span class="big">✅ Chính xác!</span><br>TT ${d.n}</div>`;
  else if(Q.state==='bad') fb=`<div class="fb no"><span class="big">❌ Sai rồi</span><br>Bạn nhập <b>${Q.input||'—'}</b> · Đáp án đúng: <span class="big">${d.n}</span></div>`;
  else if(Q.state==='skip') fb=`<div class="fb sk">Đáp án: <span class="big">${d.n}</span></div>`;
  const asked=Q.state==='ask';
  root.innerHTML=opts+stats+`<div class="quiz">
    <div class="card"><span class="qapp">PL 0${d.p}</span>
      <div class="qlab">${isPrio?'⭐ ƯU TIÊN':'🧮 ÔN TẬP'} · Nhập số TT</div>
      <div class="qtxt ${star&&!isPrio?'':''}">${esc(d.t)}</div>
      ${star&&!isPrio?'<p class="note">★ Đây là mục ưu tiên</p>':''}
      ${fb}
    </div>
    <div class="card pad">
      <div class="screen" id="screen">${asked?(Q.input||'&nbsp;'):esc(String(Q.input||'')) || '&nbsp;'}</div>
      <div class="keys">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
        <button class="del" data-act="del">⌫ Xoá</button>
        <button class="zero" data-k="0">0</button>
        <button class="ok" data-act="enter">${asked?'✔ Xác nhận':'➜ Tiếp'}</button>
      </div>
      <div class="row2">
        <button data-act="clear" style="background:#fff">🧹 Xoá hết</button>
        <button data-act="skip" ${asked?'':'disabled style="opacity:.4"'}>👀 Xem đáp án</button>
      </div>
    </div></div>`;
}
function press(k){
  if(!Q||Q.cur===null||Q.state!=='ask') return;
  if(Q.input.length>=3) return;
  Q.input+=k; $('#screen').textContent=Q.input;
}
function del(){ if(Q&&Q.state==='ask'){Q.input=Q.input.slice(0,-1);$('#screen').innerHTML=Q.input||'&nbsp;'} }
function clearIn(){ if(Q&&Q.state==='ask'){Q.input='';$('#screen').innerHTML='&nbsp;'} }
function enter(){
  if(!Q||Q.cur===null) return;
  if(Q.state!=='ask'){ nextQ(); renderQuiz(); return }
  if(!Q.input){const s=$('#screen');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');return}
  const n=Q.cur;
  Q.done++;
  if(+Q.input===n){
    Q.ok++;Q.streak++;Q.best=Math.max(Q.best,Q.streak);Q.state='ok';
    if(Q.wrong[n]>0){Q.wrong[n]--;}
  } else {
    Q.bad++;Q.streak=0;Q.state='bad';
    Q.wrong[n]=(Q.wrong[n]||0)+1;
    // đưa lại vào bộ bài sau vài câu
    Q.deck.splice(Math.min(3+Math.floor(Math.random()*3),Q.deck.length),0,n);Q.total++;
  }
  store.set('wrong',Q.wrong);
  renderQuiz();
}
function skip(){
  if(!Q||Q.state!=='ask'||Q.cur===null) return;
  Q.state='skip'; Q.done++; Q.streak=0;
  Q.wrong[Q.cur]=(Q.wrong[Q.cur]||0)+1; store.set('wrong',Q.wrong);
  Q.deck.splice(Math.min(3,Q.deck.length),0,Q.cur);Q.total++;
  renderQuiz();
}
$('#quizRoot').onclick=e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.k!==undefined) return press(b.dataset.k);
  if(b.dataset.pl) return startQuiz(mode,{pl:b.dataset.pl});
  switch(b.dataset.act){
    case 'del':del();break;case 'clear':clearIn();break;case 'enter':enter();break;
    case 'skip':skip();break;case 'restart':startQuiz(mode);break;
    case 'wrongOnly':{
      const w=Q.pool.filter(n=>Q.wrong[n]>0);
      Object.assign(Q,{deck:shuffle(w.slice()),total:w.length,done:0,ok:0,bad:0,streak:0,best:0});
      nextQ();renderQuiz();break;}
  }
};
document.addEventListener('keydown',e=>{
  if(mode==='read'||e.target.tagName==='INPUT') return;
  if(/^\d$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace'){e.preventDefault();del()}
  else if(e.key==='Enter'){e.preventDefault();enter()}
  else if(e.key==='Escape') clearIn();
});

/* scroll top */
addEventListener('scroll',()=>$('#top').classList.toggle('show',scrollY>500),{passive:true});
$('#top').onclick=()=>scrollTo({top:0});

renderRead();
setMode(mode);
</script>
<script>
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<script>
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('installBtn').style.display='block'});
document.getElementById('installBtn').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;document.getElementById('installBtn').style.display='none'};
addEventListener('appinstalled',()=>{document.getElementById('installBtn').style.display='none'});
</script>
